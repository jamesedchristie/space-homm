name: tests

on:
  push:
  pull_request:

jobs:
  godot-tests:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.5.1
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot

      - name: Import project (builds class cache)
        run: ./godot --headless --path . --import

      - name: Run tests
        run: |
          set -o pipefail
          ./godot --headless --path . -s res://tests/run_tests.gd 2>&1 | tee tests.log
          ! grep -q "SCRIPT ERROR" tests.log

      - name: Smoke-test battle screen
        run: |
          ./godot --headless --path . -s res://tools/smoke_battle_screen.gd 2>&1 | tee battle.log
          ! grep -q "SCRIPT ERROR" battle.log

      - name: Smoke-test campaign (galaxy and battle screens)
        run: |
          ./godot --headless --path . -s res://tools/smoke_campaign.gd 2>&1 | tee campaign.log
          ! grep -q "SCRIPT ERROR" campaign.log
